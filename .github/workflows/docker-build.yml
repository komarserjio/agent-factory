name: Docker build

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deployment/production/docker-compose.yml
      - deployment/development/docker-compose.yml
      - .github/workflows/docker-build.yml
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deployment/production/docker-compose.yml
      - deployment/development/docker-compose.yml
      - .github/workflows/docker-build.yml
      - package.json
      - package-lock.json
      - tsconfig.json
      - src/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      CAN_PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long

      - name: Log in to GitHub Container Registry
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ env.CAN_PUBLISH == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        if: env.CAN_PUBLISH == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify Tailscale connection
        if: env.CAN_PUBLISH == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          tailscale status --json | jq -e '.BackendState == "Running"' >/dev/null
          tailscale ip -4 >/dev/null
          tailscale ping --c=1 --until-direct=false "$DEPLOY_HOST"

      - name: Deploy to server
        if: env.CAN_PUBLISH == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          BRANCH_SUFFIX="${BRANCH_NAME##*/}"
          BRANCH_SUFFIX="$(printf '%s' "$BRANCH_SUFFIX" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-')"
          BRANCH_SUFFIX="${BRANCH_SUFFIX#-}"
          BRANCH_SUFFIX="${BRANCH_SUFFIX%-}"
          if [ "$BRANCH_SUFFIX" = "main" ]; then
            APP_NAME="$REPOSITORY_NAME"
            DEPLOYMENT_FILE="production/docker-compose.yml"
          else
            APP_NAME="$REPOSITORY_NAME-$BRANCH_SUFFIX"
            DEPLOYMENT_FILE="development/docker-compose.yml"
          fi

          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"

          SSH=(ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "$HOME/.ssh/deploy_key" -P "${DEPLOY_PORT:-22}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"

          "${SSH[@]}" "$REMOTE" "mkdir -p ~/docker/apps/$APP_NAME"
          "${SCP[@]}" "deployment/$DEPLOYMENT_FILE" "$REMOTE:docker/apps/$APP_NAME/docker-compose.yml"
          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" "$REMOTE" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          "${SSH[@]}" "$REMOTE" "APP_NAME='$APP_NAME' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' sh -s" <<'REMOTE_SCRIPT'
          set -eu
          cd "$HOME/docker/apps/$APP_NAME"
          IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" APP_NAME="$APP_NAME" docker compose up -d --pull always
          REMOTE_SCRIPT
